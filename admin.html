<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comfy — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --rose-deep: #c47c83;
    --rose-light: #f7e8ea;
    --rose-soft: #fdf2f3;
    --charcoal: #2a2020;
    --muted: #7a6565;
    --cream: #fdf8f5;
    --white: #ffffff;
    --border: rgba(196,124,131,0.18);
    --green: #22c55e;
    --red: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }

  /* LOGIN */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--rose-soft), var(--rose-light)); }
  .login-box { background: var(--white); border-radius: 20px; padding: 40px; width: 100%; max-width: 360px; box-shadow: 0 8px 40px rgba(180,100,110,0.15); text-align: center; }
  .login-logo { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--rose-deep); margin-bottom: 4px; }
  .login-sub { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
  .login-box input { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; font-family: 'DM Sans', sans-serif; margin-bottom: 12px; outline: none; }
  .login-box input:focus { border-color: var(--rose-deep); }
  .btn-primary { width: 100%; background: var(--rose-deep); color: var(--white); border: none; border-radius: 10px; padding: 12px; font-size: 14px; font-family: 'DM Sans', sans-serif; font-weight: 500; cursor: pointer; transition: opacity .2s; }
  .btn-primary:hover { opacity: .88; }
  .login-err { color: var(--red); font-size: 13px; margin-top: 8px; }

  /* ADMIN */
  .admin-wrap { display: none; }
  .admin-header { background: var(--white); border-bottom: 1px solid var(--border); padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .admin-logo { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--rose-deep); }
  .btn-logout { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer; color: var(--muted); }
  .admin-body { max-width: 900px; margin: 0 auto; padding: 24px 16px; }

  .section-title { font-family: 'Playfair Display', serif; font-size: 20px; margin-bottom: 16px; color: var(--charcoal); }

  /* FORM */
  .form-card { background: var(--white); border-radius: 16px; border: 1px solid var(--border); padding: 24px; margin-bottom: 28px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label { font-size: 12px; color: var(--muted); font-weight: 500; }
  .form-group input, .form-group select { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: 'DM Sans', sans-serif; outline: none; background: var(--white); }
  .form-group input:focus, .form-group select:focus { border-color: var(--rose-deep); }
  .form-actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn-save { background: var(--rose-deep); color: var(--white); border: none; border-radius: 10px; padding: 10px 24px; font-size: 13px; font-family: 'DM Sans', sans-serif; font-weight: 500; cursor: pointer; transition: opacity .2s; }
  .btn-save:hover { opacity: .88; }
  .btn-cancel { background: none; border: 1px solid var(--border); border-radius: 10px; padding: 10px 20px; font-size: 13px; cursor: pointer; color: var(--muted); }
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--charcoal); color: var(--white); padding: 12px 20px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .3s; z-index: 999; }
  .toast.show { opacity: 1; }

  /* PRODUCT LIST */
  .product-list { display: flex; flex-direction: column; gap: 10px; }
  .product-item { background: var(--white); border-radius: 12px; border: 1px solid var(--border); padding: 14px 16px; display: flex; align-items: center; gap: 14px; }
  .product-item.inactive { opacity: .5; }
  .product-thumb { width: 48px; height: 48px; border-radius: 8px; background: var(--rose-soft); overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .product-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .product-thumb svg { width: 22px; height: 22px; opacity: .3; }
  .product-info { flex: 1; min-width: 0; }
  .product-info .name { font-size: 14px; font-weight: 500; }
  .product-info .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .product-price { font-family: 'Playfair Display', serif; font-size: 16px; color: var(--rose-deep); font-weight: 600; flex-shrink: 0; }
  .product-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .btn-edit { background: var(--rose-soft); color: var(--rose-deep); border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .btn-toggle { background: #f0fdf4; color: var(--green); border: none; border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  .btn-toggle.off { background: #fef2f2; color: var(--red); }
  .btn-del { background: #fef2f2; color: var(--red); border: none; border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  .empty { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }
  .btn-new { background: var(--rose-deep); color: var(--white); border: none; border-radius: 10px; padding: 10px 20px; font-size: 13px; font-family: 'DM Sans', sans-serif; font-weight: 500; cursor: pointer; margin-bottom: 16px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div class="login-logo">Comfy<span style="color:#2a2020">.</span></div>
    <div class="login-sub">Painel Administrativo</div>
    <input type="password" id="senhaInput" placeholder="Digite sua senha" onkeydown="if(event.key==='Enter')entrar()">
    <button class="btn-primary" onclick="entrar()">Entrar</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- ADMIN -->
<div class="admin-wrap" id="adminWrap">
  <div class="admin-header">
    <div class="admin-logo">Comfy Admin</div>
    <button class="btn-logout" onclick="sair()">Sair</button>
  </div>
  <div class="admin-body">

    <!-- FORM -->
    <div class="form-card" id="formCard">
      <h2 class="section-title" id="formTitulo">Novo Produto</h2>
      <input type="hidden" id="editId">
      <div class="form-grid">
        <div class="form-group full">
          <label>Nome do produto</label>
          <input type="text" id="fNome" placeholder="Ex: Pijama Emily">
        </div>
        <div class="form-group">
          <label>Categoria</label>
          <input type="text" id="fCat" placeholder="Ex: Pijama, Short Doll...">
        </div>
        <div class="form-group">
          <label>Preço (R$)</label>
          <input type="number" id="fPreco" placeholder="Ex: 85" step="0.01">
        </div>
        <div class="form-group">
          <label>Tamanhos (separados por vírgula)</label>
          <input type="text" id="fSizes" placeholder="Ex: PP, P, M, G, GG">
        </div>
        <div class="form-group">
          <label>Cores disponíveis</label>
          <input type="text" id="fCores" placeholder="Ex: Rosa, Azul, Preto">
        </div>
        <div class="form-group full">
          <label>URL da foto (opcional)</label>
          <input type="text" id="fImg" placeholder="Cole aqui o link da foto">
        </div>
      </div>
      <div class="form-actions">
        <button class="btn-save" onclick="salvarProduto()">💾 Salvar produto</button>
        <button class="btn-cancel" onclick="limparForm()">Cancelar</button>
      </div>
    </div>

    <!-- LISTA -->
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
      <h2 class="section-title" style="margin:0">Produtos cadastrados</h2>
    </div>
    <div class="product-list" id="productList">
      <div class="empty">Carregando...</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════
//  CONFIGURAÇÕES
// ══════════════════════════════════════
const SENHA_ADMIN = "comfy2024";  // ← TROQUE PARA SUA SENHA!
const SUPABASE_URL = "https://pikagxlkobwasyjctfjc.supabase.co";
const SUPABASE_KEY = "sb_publishable_XE5gxAVDL4m9axaIQKenJw_6LuCoRNn";

// ══════════════════════════════════════
//  LOGIN
// ══════════════════════════════════════
function entrar() {
  const senha = document.getElementById("senhaInput").value;
  if (senha === SENHA_ADMIN) {
    document.getElementById("loginWrap").style.display = "none";
    document.getElementById("adminWrap").style.display = "block";
    carregarProdutos();
  } else {
    document.getElementById("loginErr").textContent = "Senha incorreta!";
  }
}

function sair() {
  document.getElementById("loginWrap").style.display = "flex";
  document.getElementById("adminWrap").style.display = "none";
  document.getElementById("senhaInput").value = "";
}

// ══════════════════════════════════════
//  SUPABASE
// ══════════════════════════════════════
async function api(method, path, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method,
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      "Prefer": method === "POST" ? "return=representation" : "return=minimal"
    },
    body: body ? JSON.stringify(body) : undefined
  });
  if (method === "GET" || method === "POST") return res.json();
  return res;
}

// ══════════════════════════════════════
//  CARREGAR PRODUTOS
// ══════════════════════════════════════
async function carregarProdutos() {
  const produtos = await api("GET", "produtos?order=id.asc");
  const lista = document.getElementById("productList");
  if (!produtos.length) {
    lista.innerHTML = '<div class="empty">Nenhum produto cadastrado ainda. Adicione seu primeiro produto acima! 🛍️</div>';
    return;
  }
  lista.innerHTML = produtos.map(p => {
    const precoFmt = "R$ " + Number(p.preco).toFixed(2).replace(".", ",");
    const thumb = p.img
      ? `<img src="${p.img}" alt="${p.nome}">`
      : `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>`;
    return `<div class="product-item ${p.ativo ? "" : "inactive"}" id="item-${p.id}">
      <div class="product-thumb">${thumb}</div>
      <div class="product-info">
        <div class="name">${p.nome}</div>
        <div class="meta">${p.cat || ""}${p.sizes ? " • " + p.sizes : ""}${p.cores ? " • " + p.cores : ""}</div>
      </div>
      <div class="product-price">${precoFmt}</div>
      <div class="product-actions">
        <button class="btn-edit" onclick="editarProduto(${p.id})">✏️ Editar</button>
        <button class="btn-toggle ${p.ativo ? "" : "off"}" onclick="toggleProduto(${p.id}, ${p.ativo})">${p.ativo ? "✓" : "✗"}</button>
        <button class="btn-del" onclick="deletarProduto(${p.id})">🗑️</button>
      </div>
    </div>`;
  }).join("");
}

// ══════════════════════════════════════
//  SALVAR PRODUTO
// ══════════════════════════════════════
async function salvarProduto() {
  const id = document.getElementById("editId").value;
  const dados = {
    nome: document.getElementById("fNome").value.trim(),
    cat: document.getElementById("fCat").value.trim(),
    preco: parseFloat(document.getElementById("fPreco").value) || 0,
    sizes: document.getElementById("fSizes").value.trim(),
    cores: document.getElementById("fCores").value.trim(),
    img: document.getElementById("fImg").value.trim(),
    ativo: true
  };
  if (!dados.nome) { mostrarToast("⚠️ Digite o nome do produto!"); return; }
  if (id) {
    await api("PATCH", `produtos?id=eq.${id}`, dados);
    mostrarToast("✅ Produto atualizado!");
  } else {
    await api("POST", "produtos", dados);
    mostrarToast("✅ Produto adicionado!");
  }
  limparForm();
  carregarProdutos();
}

// ══════════════════════════════════════
//  EDITAR
// ══════════════════════════════════════
async function editarProduto(id) {
  const produtos = await api("GET", `produtos?id=eq.${id}`);
  const p = produtos[0];
  document.getElementById("editId").value = p.id;
  document.getElementById("fNome").value = p.nome || "";
  document.getElementById("fCat").value = p.cat || "";
  document.getElementById("fPreco").value = p.preco || "";
  document.getElementById("fSizes").value = p.sizes || "";
  document.getElementById("fCores").value = p.cores || "";
  document.getElementById("fImg").value = p.img || "";
  document.getElementById("formTitulo").textContent = "Editar Produto";
  document.getElementById("formCard").scrollIntoView({ behavior: "smooth" });
}

// ══════════════════════════════════════
//  TOGGLE ATIVO
// ══════════════════════════════════════
async function toggleProduto(id, ativoAtual) {
  await api("PATCH", `produtos?id=eq.${id}`, { ativo: !ativoAtual });
  mostrarToast(ativoAtual ? "Produto ocultado do catálogo" : "Produto visível no catálogo");
  carregarProdutos();
}

// ══════════════════════════════════════
//  DELETAR
// ══════════════════════════════════════
async function deletarProduto(id) {
  if (!confirm("Tem certeza que quer apagar este produto?")) return;
  await api("DELETE", `produtos?id=eq.${id}`);
  mostrarToast("🗑️ Produto apagado!");
  carregarProdutos();
}

function limparForm() {
  document.getElementById("editId").value = "";
  document.getElementById("fNome").value = "";
  document.getElementById("fCat").value = "";
  document.getElementById("fPreco").value = "";
  document.getElementById("fSizes").value = "";
  document.getElementById("fCores").value = "";
  document.getElementById("fImg").value = "";
  document.getElementById("formTitulo").textContent = "Novo Produto";
}

function mostrarToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3000);
}
</script>
</body>
</html>
