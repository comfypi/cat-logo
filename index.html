<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comfy — Catálogo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --rose: #e8b4b8;
    --rose-deep: #c47c83;
    --rose-light: #f7e8ea;
    --rose-soft: #fdf2f3;
    --charcoal: #2a2020;
    --muted: #7a6565;
    --cream: #fdf8f5;
    --white: #ffffff;
    --border: rgba(196,124,131,0.18);
    --shadow: 0 4px 32px rgba(180,100,110,0.10);
    --wa: #25D366;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }

  .header {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .logo { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 600; color: var(--rose-deep); letter-spacing: 1px; }
  .logo span { color: var(--charcoal); }

  .hero {
    background: linear-gradient(135deg, var(--rose-soft) 0%, var(--rose-light) 100%);
    padding: 40px 20px 32px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  .hero-title { font-family: 'Playfair Display', serif; font-size: clamp(28px,6vw,42px); font-weight: 600; color: var(--charcoal); margin-bottom: 8px; }
  .hero-sub { font-size: 14px; color: var(--muted); font-weight: 300; }

  .filter-bar {
    padding: 16px 20px;
    display: flex; gap: 8px;
    overflow-x: auto; scrollbar-width: none;
    background: var(--white);
    border-bottom: 1px solid var(--border);
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-btn {
    border: 1px solid var(--border);
    background: var(--white);
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    transition: all .2s;
  }
  .filter-btn.active, .filter-btn:hover { background: var(--rose-deep); color: var(--white); border-color: var(--rose-deep); }

  .catalog {
    padding: 20px 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
    max-width: 900px;
    margin: 0 auto;
  }

  .product-card {
    background: var(--white);
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border);
    transition: transform .2s, box-shadow .2s;
    animation: fadeIn .3s ease both;
  }
  .product-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
  .product-card.hidden { display: none; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .card-img {
    width: 100%;
    aspect-ratio: 3/4;
    overflow: hidden;
    background: var(--rose-soft);
    display: flex; align-items: center; justify-content: center;
  }
  .card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-img .no-photo {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    background: linear-gradient(135deg, var(--rose-soft), var(--rose-light));
  }
  .card-img .no-photo svg { width: 40px; height: 40px; opacity: .35; }
  .card-img .no-photo span { font-size: 11px; color: var(--muted); }

  .card-body { padding: 12px; }
  .card-cat { font-size: 11px; color: var(--muted); font-weight: 300; margin-bottom: 3px; }
  .card-name { font-size: 13px; font-weight: 500; color: var(--charcoal); margin-bottom: 6px; line-height: 1.3; }
  .card-price { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 600; color: var(--rose-deep); margin-bottom: 7px; }
  .card-sizes { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
  .size-tag { font-size: 10px; background: var(--rose-soft); color: var(--rose-deep); border-radius: 4px; padding: 2px 6px; font-weight: 500; }

  .btn-wa {
    width: 100%;
    background: var(--wa);
    color: var(--white);
    border: none; border-radius: 10px;
    padding: 9px 0;
    font-size: 12px; font-family: 'DM Sans', sans-serif; font-weight: 500;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none;
    transition: opacity .2s;
  }
  .btn-wa:hover { opacity: .88; }

  .footer { text-align: center; padding: 28px 20px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); margin-top: 20px; }
</style>
</head>
<body>

<header class="header">
  <div class="logo">Comfy<span>.</span></div>
</header>

<div class="hero">
  <h1 class="hero-title">Nosso Catálogo</h1>
  <p class="hero-sub">Pijamas, Short Dolls, Camisolas e muito mais ✨</p>
</div>

<div class="filter-bar" id="filterBar"></div>
<div class="catalog" id="catalog"></div>

<div class="footer">
  <p>Comfy • Moda íntima feminina</p>
  <p style="margin-top:4px">Atendemos pelo WhatsApp 💬</p>
</div>

<script>
const MEU_WHATSAPP = "5599912345678";

const PRODUTOS = [
  { nome: "Pijama Emily", cat: "Pijama", preco: 85, sizes: ["PP","P","M","G","GG"], cores: "Laços, Corações, Vaquinha", img: "" },
  { nome: "Pijama Aurora", cat: "Pijama", preco: 85, sizes: ["PP","P","M","G","GG"], cores: "Vermelho, Preto, Rosa", img: "" },
  { nome: "Pijama Arezzo", cat: "Pijama", preco: 95, sizes: ["PP","P","M","G","GG"], cores: "", img: "" },
  { nome: "Pijama Infantil Manguinha", cat: "Pijama Infantil", preco: 65, sizes: ["2","4","6","8","10"], cores: "", img: "" },
  { nome: "Short Doll Serena", cat: "Short Doll", preco: 75, sizes: ["P","M","G","GG"], cores: "Lilás, Azul, Rosa", img: "" },
  { nome: "Short Doll Luna", cat: "Short Doll", preco: 55, sizes: ["P","M","G","GG"], cores: "Vermelho, Rosa", img: "" },
  { nome: "Short Doll Diana", cat: "Short Doll", preco: 60, sizes: ["P","M","G","GG"], cores: "Verde", img: "" },
  { nome: "Short Doll Luisa", cat: "Short Doll", preco: 50, sizes: ["P","M","G","GG"], cores: "Preto, Lilás", img: "" },
  { nome: "Camisola Veneza", cat: "Camisola", preco: 85, sizes: ["P","M","G","GG"], cores: "Azul", img: "" },
  { nome: "Body Poliamida", cat: "Body", preco: 65, sizes: ["Único"], cores: "Verde, Branco, Preto, Marrom", img: "" },
  { nome: "Regata Polo", cat: "Regata", preco: 80, sizes: ["PP","P","M","G","GG"], cores: "", img: "" },
  { nome: "Regata Canelada", cat: "Regata", preco: 50, sizes: ["Único"], cores: "Vermelho", img: "" },
  { nome: "Regata BR", cat: "Regata", preco: 55, sizes: ["M","G","GG"], cores: "", img: "" },
];

let filtroAtivo = "Todos";

function buildFilters() {
  const cats = ["Todos", ...new Set(PRODUTOS.map(p => p.cat))];
  document.getElementById("filterBar").innerHTML = cats.map(c =>
    `<button class="filter-btn ${c === filtroAtivo ? "active" : ""}" onclick="setFiltro('${c}',this)">${c}</button>`
  ).join("");
}

function setFiltro(cat, btn) {
  filtroAtivo = cat;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderCatalog();
}

function renderCatalog() {
  const lista = filtroAtivo === "Todos" ? PRODUTOS : PRODUTOS.filter(p => p.cat === filtroAtivo);
  document.getElementById("catalog").innerHTML = lista.map((p, i) => {
    const imgEl = p.img
      ? `<img src="${p.img}" alt="${p.nome}" loading="lazy">`
      : `<div class="no-photo">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
            <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
          <span>foto em breve</span>
        </div>`;
    const sizes = p.sizes && p.sizes.length
      ? `<div class="card-sizes">${p.sizes.map(s => `<span class="size-tag">${s}</span>`).join("")}</div>` : "";
    const precoFmt = "R$ " + p.preco.toFixed(2).replace(".", ",");
    const msg = encodeURIComponent(`Olá! Vi no catálogo e tenho interesse em: *${p.nome}* (${precoFmt})`);
    const waLink = `https://wa.me/${MEU_WHATSAPP}?text=${msg}`;
    return `<div class="product-card" style="animation-delay:${i * 0.04}s">
      <div class="card-img">${imgEl}</div>
      <div class="card-body">
        <div class="card-cat">${p.cat}</div>
        <div class="card-name">${p.nome}</div>
        ${p.cores ? `<div class="card-cat" style="margin-bottom:6px">${p.cores}</div>` : ""}
        <div class="card-price">${precoFmt}</div>
        ${sizes}
        <a class="btn-wa" href="${waLink}" target="_blank">
          <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
          </svg>
          Pedir pelo WhatsApp
        </a>
      </div>
    </div>`;
  }).join("");
}

buildFilters();
renderCatalog();
</script>
</body>
</html>
